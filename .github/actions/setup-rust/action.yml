name: Set up Rust
description: Install recourse's reviewed Rust toolchain through immutable action code.

inputs:
  toolchain:
    description: Exact Rust toolchain version to install.
    required: false
    default: "1.96.0"

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
      with:
        toolchain: ${{ inputs.toolchain }}
        components: rustfmt, clippy
