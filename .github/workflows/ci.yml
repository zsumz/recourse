name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  canonical:
    name: canonical
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - uses: ./.github/actions/setup-rust
      - run: cargo fetch --locked
      - run: scripts/check

  framework-neutral:
    name: framework-neutral
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo fetch --locked
      - run: >-
          cargo test
          -p recourse
          -p dispatch-model
          -p dispatch-diagnostics
          -p dispatch-service
          -p dispatch-worker
          -p dispatch-cli
          -p dispatch-catalog
          --all-targets
          --locked

  latest-stable:
    name: latest stable (1.97.1)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.97.1"
      - run: cargo fetch --locked
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  supply-chain:
    name: supply chain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny --all-features check advisories licenses sources

  source-semver:
    name: source semver
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo install cargo-semver-checks --version 0.49.0 --locked
      - name: Resolve frozen API snapshot
        run: |
          test "$(git cat-file -t refs/tags/api/v0.0.1-rc.3)" = tag
          test "$(git rev-parse 'api/v0.0.1-rc.3^{commit}')" = \
            c14b100c4dae2c859520fbdf427dbb785c9b0990
      - run: >-
          cargo semver-checks --package recourse
          --baseline-rev api/v0.0.1-rc.3
          --release-type patch
      - run: >-
          cargo semver-checks --package recourse-axum
          --baseline-rev api/v0.0.1-rc.3
          --release-type patch

  catalog-determinism:
    name: catalog determinism (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo fetch --locked
      - run: bash scripts/check-dispatch-artifacts

  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: rustup toolchain install nightly-2026-08-01 --profile minimal --component clippy
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: scripts/fuzz-smoke
