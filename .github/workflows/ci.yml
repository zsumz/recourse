name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  canonical:
    name: canonical
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo fetch --locked
      - run: scripts/check

  framework-neutral:
    name: framework-neutral
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo fetch --locked
      - run: >-
          cargo test
          -p recourse
          -p dispatch-model
          -p dispatch-diagnostics
          -p dispatch-service
          -p dispatch-worker
          -p dispatch-cli
          -p dispatch-catalog
          --all-targets
          --locked

  supply-chain:
    name: supply chain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny --all-features check advisories licenses sources

  source-semver:
    name: source semver
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo install cargo-semver-checks --version 0.49.0 --locked
      - run: >-
          cargo semver-checks --package recourse
          --baseline-rev eb30b0659eea477fb255b5bcfcb91c11d31f758d
      - run: >-
          cargo semver-checks --package recourse-axum
          --baseline-rev eb30b0659eea477fb255b5bcfcb91c11d31f758d

  catalog-determinism:
    name: catalog determinism (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo fetch --locked
      - run: bash scripts/check-dispatch-artifacts

  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: rustup toolchain install nightly-2026-08-01 --profile minimal --component clippy
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: scripts/fuzz-smoke
