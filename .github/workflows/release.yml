name: Verify tagged release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed tag whose crates.io cohort is already published
        required: true
        type: string

permissions:
  contents: read

env:
  RECOURSE_RELEASE_FINGERPRINT: B58439871CD2A7275B20CC19EC8E4D26598A0373

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify signed tag and packages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: candidate
    steps:
      - name: Check out trusted verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Check out release candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.tag }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - uses: ./trusted/.github/actions/setup-rust
      - name: Verify signed release identity
        env:
          GNUPGHOME: ${{ runner.temp }}/release-gnupg
          TAG: ${{ inputs.tag }}
        run: |
          install -d -m 700 "$GNUPGHOME"
          key=../trusted/etc/release-signing-key.asc
          fingerprint=$(gpg --batch --with-colons --import-options show-only \
            --import "$key" | awk -F: '$1 == "fpr" { print $10; exit }')
          if [[ "$fingerprint" != "$RECOURSE_RELEASE_FINGERPRINT" ]]; then
            echo "trusted release key fingerprint does not match policy" >&2
            exit 1
          fi
          gpg --batch --import "$key"
          git fetch --no-tags origin main:refs/remotes/origin/main
          ../trusted/scripts/verify-release-tag \
            "$PWD" "$TAG" "$RECOURSE_RELEASE_FINGERPRINT"
      - run: scripts/check-clean-tree
      - run: cargo fetch --locked
      - run: scripts/check
      - run: scripts/check-clean-tree
      - name: Verify published crates and record exact checksums
        run: |
          archive_dir="$RUNNER_TEMP/registry-packages"
          scripts/check-published-packages "$archive_dir"
          shasum -a 256 "$archive_dir"/*.crate | sed "s|$archive_dir/||" \
            > "$archive_dir/SHA256SUMS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: crates-${{ github.sha }}
          path: |
            ${{ runner.temp }}/registry-packages/*.crate
            ${{ runner.temp }}/registry-packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: crates-${{ github.sha }}
          path: ${{ runner.temp }}/release
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          flags=(--verify-tag --generate-notes --title "recourse $TAG")
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" \
            "$RUNNER_TEMP"/release/*.crate \
            "$RUNNER_TEMP"/release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            "${flags[@]}"
