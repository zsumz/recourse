name: Verify tagged release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify signed tag and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - uses: ./.github/actions/setup-rust
      - name: Verify signed release identity
        env:
          GNUPGHOME: ${{ runner.temp }}/release-gnupg
        run: |
          install -d -m 700 "$GNUPGHOME"
          gpg --batch --import etc/release-signing-key.asc
          git fetch --no-tags origin main:refs/remotes/origin/main
          scripts/verify-release-tag "$GITHUB_REF_NAME"
      - run: cargo fetch --locked
      - run: scripts/check
      - name: Record exact crate checksums
        run: |
          version=${GITHUB_REF_NAME#v}
          for package in recourse recourse-axum recourse-cli; do
            test -f "target/package/$package-$version.crate"
          done
          shasum -a 256 target/package/*.crate | tee target/package/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: crates-${{ github.sha }}
          path: |
            target/package/*.crate
            target/package/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: crates-${{ github.sha }}
          path: ${{ runner.temp }}/release
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--verify-tag --generate-notes --title "recourse $TAG")
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" \
            "$RUNNER_TEMP"/release/*.crate \
            "$RUNNER_TEMP"/release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            "${flags[@]}"
